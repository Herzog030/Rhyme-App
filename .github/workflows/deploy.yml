name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/german-rhyme-dictionary-app-C7NYy
  workflow_dispatch:

# Rechte, die der Workflow braucht, um nach GitHub Pages zu deployen
permissions:
  contents: read
  pages: write
  id-token: write

# Laufende Deploys nicht parallel zulassen – das neuere gewinnt.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test

      - name: Build (Vite)
        # Base-Pfad entspricht dem Repo-Namen, damit alle Asset-URLs
        # unter https://<user>.github.io/<repo>/ korrekt aufgelöst werden.
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
